name: Actions Startup Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/actions-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner startup
        run: |
          echo "GitHub Actions runner started successfully."
          echo "Repository workflow dispatch and job graph are being tested."
